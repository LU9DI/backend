services:
  filtra-api:
    image: ghcr.io/lu9di/backend:${IMAGE_TAG:-latest}
    container_name: filtra-ai-api
    restart: unless-stopped
    env_file:
      - /opt/filtra-ai/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CHROMIUM_PATH: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ACQUISITION_BROWSER_BOT: "0"
    ports:
      - "127.0.0.1:5000:5000"
    init: true
    stop_grace_period: 30s
    mem_limit: 6g
    cpus: 1.75
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
