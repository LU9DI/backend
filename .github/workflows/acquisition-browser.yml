name: Filtra acquisition browser

on:
  push:
    branches:
      - master
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger acquisition browser cycle
        env:
          FILTRA_API_URL: https://filtra-ia-api.onrender.com
          ACQUISITION_BROWSER_CRON_SECRET: ${{ secrets.ACQUISITION_BROWSER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ACQUISITION_BROWSER_CRON_SECRET"
          curl --fail-with-body --silent --show-error             --request POST             --header "x-acquisition-cron-secret: $ACQUISITION_BROWSER_CRON_SECRET"             --header "content-type: application/json"             --data '{}'             "$FILTRA_API_URL/api/n8n/acquisition/browser/tick"
