name: Remediate npm audit lockfile

on:
  push:
    branches: [fix/npm-audit-remediation]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/remediate-npm-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-audit-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Update vulnerable compatible dependency versions
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile updates for review
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes generated.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix(security): update vulnerable dependency lockfile'
            git push
          fi
      - name: Install cleanly without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        run: npm test
      - name: Check TypeScript build
        run: npm run build
      - name: Fail on remaining high or critical advisories
        run: npm audit --audit-level=high
