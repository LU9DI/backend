name: Fix Mercado Pago webhook signature

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct Mercado Pago data.id signature source
        shell: python
        run: |
          from pathlib import Path
          p = Path('routes/pixRoutes.ts')
          s = p.read_text(encoding='utf-8')

          old = """      const body = req.body || {};\n      const type = String(body.type || body.action || body.topic || '');\n      const dataId = String(body.data?.id || body.id || (body as any)['data.id'] || '').trim();\n\n      const xSig = (req.headers['x-signature'] as string) || '';\n"""
          new = """      const body = req.body || {};\n      // Mercado Pago signs the data.id from the query string, not the JSON body.\n      const queryDataId = String((req.query as any)['data.id'] || '').trim();\n      const type = String(req.query.type || body.type || body.action || body.topic || '').trim();\n      const dataId = String(queryDataId || body.data?.id || body.id || (body as any)['data.id'] || '').trim();\n\n      const xSig = (req.headers['x-signature'] as string) || '';\n"""
          if old not in s:
              raise SystemExit('Expected webhook block not found')
          s = s.replace(old, new, 1)

          old2 = """          xSignature: xSig,\n          xRequestId: xReq,\n          dataId: dataId || null,\n"""
          new2 = """          xSignature: xSig,\n          xRequestId: xReq,\n          dataId: queryDataId || dataId || null,\n"""
          if old2 not in s:
              raise SystemExit('Expected signature arguments not found')
          s = s.replace(old2, new2, 1)

          old3 = """      const topic = String(req.query.topic || body.topic || type || '');\n      const qid = String(req.query.id || dataId || '').trim();\n"""
          new3 = """      const topic = String(req.query.topic || req.query.type || body.topic || type || '').trim();\n      const qid = String(req.query.id || queryDataId || dataId || '').trim();\n"""
          if old3 not in s:
              raise SystemExit('Expected query topic block not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-mp-webhook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/pixRoutes.ts .github/workflows/fix-mp-webhook.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: validate Mercado Pago webhook using query data.id"
          git push
