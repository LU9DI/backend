services:
  - type: web
    name: filtra-ia-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: filtra-ia-db
          property: connectionString
